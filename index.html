<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objetivo: Transformación Cultural · Farmatodo Argentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002858; --navy2:#001E62; --blue:#0084d0; --blue2:#00A6DC; --skyline:#418FDE;
  --teal:#00a19a; --purple:#4a106e; --olive:#a1ac00; --magenta:#E50571; --gold:#f7da00;
  --bg:#f2f5f9; --card:#ffffff; --line:#dde4ee; --text:#1c2b3f; --text-mid:#4a5c73; --text-soft:#7c8ba0;
  --green:#1f9254; --green-bg:#e8f6ee; --amber:#c9860a; --amber-bg:#fdf3e2; --red:#c23b3b; --red-bg:#fbe9e9;
  --blue-lt:#eef1fd;
  --shadow:0 2px 14px rgba(0,40,88,0.08); --shadow-md:0 10px 34px rgba(0,40,88,0.16);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}
img{max-width:100%;}

/* HERO */
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);position:relative;overflow:hidden;padding:22px 0 20px;box-sizing:border-box;}
.hero::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(0,132,208,0.35) 0%,transparent 70%);pointer-events:none;}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--teal),var(--purple),var(--magenta),var(--olive));}
.hero-inner{max-width:1560px;margin:0 auto;position:relative;z-index:2;padding:0 6vw;box-sizing:border-box;}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.hero-brand{display:flex;align-items:center;gap:14px;}
.hero-brand img{height:30px;width:auto;display:block;}
.hero-flag{height:21px;width:auto;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.25);}
.refresh-control{display:flex;align-items:center;gap:10px;}
.refresh-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.22);color:#fff;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;border-radius:100px;padding:7px 14px;cursor:pointer;}
.refresh-btn:hover{background:rgba(255,255,255,0.2);}
.last-updated{font-size:10.5px;color:#a9c1de;font-weight:600;white-space:nowrap;}
.hero-title{position:relative;z-index:2;margin-top:14px;}
.hero-eyebrow{color:var(--gold);font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.hero-title h1{color:#fff;font-size:clamp(21px,2.4vw,28px);font-weight:800;letter-spacing:-0.01em;max-width:820px;}
.hero-title p{color:#a9c1de;font-size:13.5px;margin-top:6px;max-width:680px;font-weight:500;}
.weight-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(247,218,0,0.14);border:1px solid rgba(247,218,0,0.4);color:var(--gold);font-size:11px;font-weight:800;border-radius:100px;padding:5px 12px;margin-top:12px;}

/* LAYOUT */
.layout{display:flex;align-items:stretch;gap:0;max-width:1560px;margin:0 auto;padding:0 6vw 70px;box-sizing:border-box;}
.sidebar{width:270px;flex:none;border-right:1px solid var(--line);padding:24px 20px 24px 0;margin-right:30px;}
.sidebar-inner{display:flex;flex-direction:column;gap:4px;}
.tab-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:none;background:none;cursor:pointer;padding:12px 14px;font-family:'Nunito',sans-serif;border-left:3px solid transparent;border-radius:0 8px 8px 0;text-align:left;transition:all .15s;}
.tab-btn:hover{background:#f7f9fc;}
.tab-btn.active{border-left-color:var(--tier-color,var(--blue));background:var(--blue-lt);}
.tab-btn .t-tier{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tier-color,var(--text-soft));}
.tab-btn .t-label{font-size:12.5px;font-weight:800;color:var(--text-mid);line-height:1.3;}
.tab-btn.active .t-label{color:var(--navy);}
@media (max-width:900px){
  .layout{flex-direction:column;padding:0 0 50px;}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);margin-right:0;padding:0;}
  .sidebar-inner{flex-direction:row;overflow-x:auto;gap:4px;padding:0 6vw;}
  .tab-btn{flex:none;white-space:nowrap;border-left:none;border-bottom:3px solid transparent;border-radius:0;padding:14px 14px 12px;}
  .wrap{padding:24px 6vw 0;}
}
.wrap{flex:1;min-width:0;padding:24px 0 0;}

.section-head{margin-bottom:16px;}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:4px;}
.section-head h2{font-size:19px;font-weight:800;color:var(--navy);}
.section-head p{font-size:13px;color:var(--text-soft);font-weight:600;margin-top:4px;}

/* RESUMEN: tarjeta objetivo */
.objective-card{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);border-radius:18px;padding:26px 28px;margin-bottom:26px;position:relative;overflow:hidden;}
.objective-card .weight{display:inline-block;background:rgba(255,255,255,0.14);color:#fff;font-size:11px;font-weight:800;border-radius:100px;padding:5px 14px;margin-bottom:10px;}
.objective-card .obj-n{display:inline-block;color:var(--gold);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-left:8px;}
.objective-card h2{color:#fff;font-size:23px;font-weight:800;margin-bottom:8px;}
.objective-card p{color:#a9c1de;font-size:13.5px;font-style:italic;max-width:760px;}

.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:10px;}
@media (max-width:820px){.tier-grid{grid-template-columns:1fr;}}
.tier-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;}
.tier-card.clickable{cursor:pointer;transition:transform .18s, box-shadow .18s;}
.tier-card.clickable:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--blue);}
.tier-card.result{background:var(--green-bg);border-color:#bfe4cd;}
.tier-label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);}
.tier-card.result .tier-label{color:var(--green);}
.tier-val{font-size:26px;font-weight:800;color:var(--navy);margin:6px 0 8px;}
.tier-card.result .tier-val{color:var(--green);}
.tier-desc{font-size:11.5px;color:var(--text-mid);font-weight:600;line-height:1.5;}
.tier-badge{position:absolute;top:-10px;right:14px;background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:100px;}

.methodology{font-size:11.5px;color:var(--text-soft);font-weight:600;margin:18px 0 30px;line-height:1.6;border-left:3px solid var(--line);padding-left:12px;}

/* TABLA ROADMAP */
.ficha-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:1100px){.ficha-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:700px){.ficha-grid{grid-template-columns:1fr;}}
.ficha-area{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;
  border-top:4px solid var(--ficha-color, var(--blue));display:flex;flex-direction:column;
}
.ficha-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.ficha-titulo{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:12px;line-height:1.3;}
.ficha-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.ficha-tag{font-size:10.5px;font-weight:700;color:var(--text-mid);background:#f0f2f6;border-radius:100px;padding:4px 10px;}
.ficha-tag.good{background:var(--green-bg);color:var(--green);}
.ficha-tag.warn{background:var(--amber-bg);color:var(--amber);}
.ficha-tag.bad{background:var(--red-bg);color:var(--red);}
.ficha-progress-box{background:#f7f9fc;border-radius:10px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.ficha-progress-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.ficha-progress-label{font-size:10px;font-weight:800;letter-spacing:.04em;}
.ficha-progress-frac{font-size:20px;font-weight:800;}
.ficha-list-label{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-soft);margin-bottom:8px;}
.ficha-body{flex:1;}
.ficha-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.ficha-item:last-child{border-bottom:none;}
.ficha-item-nombre{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.4;}
.prog-track{background:#e9edf3;border-radius:100px;height:8px;overflow:hidden;}
.prog-fill{height:100%;border-radius:100px;transition:width .3s;}
.avance-box{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 20px; margin-bottom:18px;
  display:flex; align-items:center; gap:18px;
}
.avance-val{font-size:32px;font-weight:800;color:var(--navy);line-height:1;}
.avance-lbl{font-size:12.5px;font-weight:700;color:var(--text-mid);line-height:1.5;}
.avance-lbl span{font-size:11px;color:var(--text-soft);font-weight:600;}
.filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.filter-select{border:1px solid var(--line);border-radius:100px;padding:8px 14px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--text-mid);background:#fff;cursor:pointer;}
.roadmap-count{font-size:12px;color:var(--text-soft);font-weight:700;margin-bottom:12px;}
table.rm-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:12.5px;}
table.rm-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-soft);padding:10px 12px;border-bottom:2px solid var(--line);font-weight:800;background:#f7f9fc;}
table.rm-table td{padding:12px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-weight:600;color:var(--text);}
table.rm-table tr:last-child td{border-bottom:none;}
table.rm-table tr:hover td{background:#fbfcfe;}
.area-pill{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:100px;background:var(--blue-lt);color:var(--navy);white-space:nowrap;}
.badge{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:100px;white-space:nowrap;display:inline-block;}
.badge.completado{background:var(--green-bg);color:var(--green);}
.badge.progreso{background:var(--amber-bg);color:var(--amber);}
.badge.pendiente{background:var(--red-bg);color:var(--red);}
.indicador-cell{color:var(--text-mid);font-weight:500;font-size:12px;}
.table-scroll{overflow-x:auto;}

/* META: doc salarial */
.exec-banner{background:var(--green-bg);border:1px solid #bfe4cd;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:10px;margin-bottom:24px;font-weight:800;color:var(--green);font-size:13px;}
.exec-banner .ic{font-size:18px;}
.doc-section{margin-bottom:26px;}
.doc-section h4{font-size:13px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;}
.doc-section p{font-size:13px;color:var(--text-mid);font-weight:500;line-height:1.6;}
.doc-section ul{margin:0;padding-left:20px;}
.doc-section li{font-size:13px;color:var(--text-mid);font-weight:500;line-height:1.6;margin-bottom:6px;}
.doc-callout{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:14px 18px;font-size:13px;color:var(--text);font-weight:600;line-height:1.6;}
.doc-callout.warn{border-left-color:var(--amber);background:var(--amber-bg);}
.plan-step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
.plan-step .step-n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:800;margin-right:8px;}
.plan-step h5{display:inline;font-size:13.5px;font-weight:800;color:var(--navy);}
.plan-step ul{margin-top:10px;}

/* SUPERIOR: organigramas */
.org-dept{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 20px 20px;margin-bottom:22px;}
.org-dept-title{font-size:14px;font-weight:800;color:var(--navy);text-align:center;margin-bottom:18px;text-transform:uppercase;letter-spacing:.03em;}
.orgchart{display:flex;flex-direction:column;align-items:center;}
.org-box{background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;text-align:center;min-width:180px;box-shadow:var(--shadow);}
.org-box .cargo{font-size:12px;font-weight:800;}
.org-box .persona{font-size:11px;font-weight:600;color:#bcd4f0;margin-top:3px;}
.org-box .persona.vacante{color:#ffd9d9;font-style:italic;}
.org-vline{width:2px;height:22px;background:var(--line);}
.org-hline-wrap{position:relative;width:100%;display:flex;justify-content:center;}
.org-hline{height:2px;background:var(--line);width:92%;max-width:1100px;}
.org-children{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px;padding-top:20px;max-width:1200px;}
.org-child{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;min-width:170px;max-width:230px;}
.org-child::before{content:'';position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:2px;height:20px;background:var(--line);}
.org-child .cargo{font-size:11.5px;font-weight:800;color:var(--navy);margin-bottom:4px;}
.org-child .chain-row{font-size:10.5px;font-weight:600;color:var(--text-mid);line-height:1.5;}
.org-child .chain-row b{color:var(--text-soft);font-weight:800;font-size:9px;text-transform:uppercase;margin-right:4px;}
.org-child .chain-row.vacante{color:var(--red);font-style:italic;}
.org-note{margin-top:16px;font-size:11.5px;color:var(--text-soft);font-weight:600;line-height:1.6;border-left:3px solid var(--line);padding-left:12px;}

footer{text-align:center;padding:26px 0 40px;font-size:11.5px;color:var(--text-soft);font-weight:600;}
</style>
</head>

function apiConfigured(){ return API_ROADMAP_URL && API_ROADMAP_URL.indexOf('PASTE_YOUR') === -1; }

function normalizeEstatus(raw){
  const t = String(raw||'').trim().toLowerCase();
  if(!t) return 'pendiente';
  if(t.indexOf('ejecutado')>=0 || t.indexOf('completado')>=0) return 'completado';
  if(t.indexOf('progreso')>=0 || t.indexOf('proceso')>=0 || t.indexOf('curso')>=0) return 'progreso';
  if(t.indexOf('pendiente')>=0 || t.indexOf('por ejecutar')>=0) return 'pendiente';
  // cualquier otro texto (ej. nombre de una persona) no es un estatus reconocible -> pendiente por defecto
  return 'pendiente';
}
function normalizeAvance(raw){
  if(raw===''||raw===null||raw===undefined) return null;
  const n = Number(String(raw).replace('%','').replace(',','.').trim());
  return isNaN(n) ? null : (n<=1 ? Math.round(n*100) : Math.round(n));
}

function isExcludedArea(area){
  const t = String(area||'').toLowerCase();
  return t.indexOf('líderes argentina') >= 0 || t.indexOf('lideres argentina') >= 0;
}
function fillMergedAreas(rows){
  // Red de seguridad: si el Apps Script (por versión vieja) devuelve el área
  // vacía en filas que en el Sheet están combinadas verticalmente, la
  // reconstruimos aquí usando la última área no vacía vista en orden.
  let last = '';
  return rows.map(r=>{
    const a = String(r.area||'').trim();
    if(a){ last = a; return r; }
    return Object.assign({}, r, { area: last });
  });
}
async function loadRoadmapLive(){
  if(!apiConfigured()) { liveMode = false; DATA.roadmap = DATA.roadmap.filter(r=>!isExcludedArea(r.area)); renderMain(); updateLastUpdatedLabel(); return; }
  try{
    const res = await fetch(API_ROADMAP_URL, { method:'GET' });
    const json = await res.json();
    if(!json.ok) throw new Error(json.error||'Error al leer la hoja');
    DATA.roadmap = fillMergedAreas(json.data)
      .filter(r=>!isExcludedArea(r.area))
      .map(r=>({
        area: r.area, dimension: r.dimension, iniciativa: r.iniciativa,
        indicador: r.indicador, estatus: normalizeEstatus(r.estatus), avance: normalizeAvance(r.avance),
      }));
    liveMode = true;
  }catch(err){
    console.error('No se pudo conectar con la hoja Roadmap por Gerencia:', err);
    liveMode = false;
  }
  renderMain();
  updateLastUpdatedLabel();
}
async function refreshRoadmap(){
  const btn = document.getElementById('refreshBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Actualizando…'; }
  await loadRoadmapLive();
  if(btn){ btn.disabled = false; btn.textContent = '⟳ Actualizar'; }
}

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const STATE_LABEL = {completado:'Completado', progreso:'En progreso', pendiente:'Pendiente'};

function weightedPctSimple(items){
  if(!items.length) return 0;
  const score = items.reduce((s,i)=> s + (i.estatus==='completado'?1: i.estatus==='progreso'?0.5:0), 0);
  return Math.round(score/items.length*100);
}

function computeMinimoAvg(){
  // Solo promedia las iniciativas que YA tienen un % registrado en la columna "Avance".
  // Las que aún no tienen dato no se cuentan (ni suman ni restan), así que el promedio
  // sube o baja a medida que se van completando esos datos en la hoja.
  const vals = DATA.roadmap.map(r=>r.avance).filter(v=>v!==null && v!==undefined);
  if(!vals.length) return 0;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

function updateLastUpdatedLabel(){
  const el = document.getElementById('lastUpdated');
  if(!el) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  if(!apiConfigured()){
    el.textContent = 'Datos de referencia (sin conectar) · ' + hh+':'+mm;
  } else if(liveMode){
    el.textContent = 'Conectado a la hoja · ' + hh+':'+mm;
  } else {
    el.textContent = 'Sin conexión · ' + hh+':'+mm;
  }
}

  if(filterEstatus) rows = rows.filter(r=>r.estatus===filterEstatus);

  const counts = {completado:0,progreso:0,pendiente:0};
  DATA.roadmap.forEach(r=>counts[r.estatus]++);
  const avanceCount = DATA.roadmap.filter(r=>r.avance!==null && r.avance!==undefined).length;
  const minimoAvg = computeMinimoAvg();

  // Agrupar por área, respetando el orden de aparición
  const grouped = {};
  const order = [];
  rows.forEach(r=>{
    const key = r.area || 'Sin área asignada';
    if(!grouped[key]){ grouped[key] = []; order.push(key); }
    grouped[key].push(r);
  });

  const FICHA_COLORS = ['#0084d0','#1f9254','#c9860a','#4a106e','#00a19a','#E50571','#418FDE','#a1ac00','#c23b3b'];
  const fichasHtml = order.map((area,idx)=>{
    const items = grouped[area];
    const c = {completado:0,progreso:0,pendiente:0};
    items.forEach(r=>c[r.estatus]++);
    const color = FICHA_COLORS[idx % FICHA_COLORS.length];
    return `
      <div class="ficha-area" style="--ficha-color:${color}">
        <div class="ficha-top">
          <div class="ficha-eyebrow" style="color:${color}">Área responsable</div>
          <div class="ficha-titulo">${esc(area)}</div>
          <div class="ficha-tags">
            <span class="ficha-tag">${items.length} iniciativa${items.length===1?'':'s'}</span>
            ${c.completado?`<span class="ficha-tag good">${c.completado} completada${c.completado===1?'':'s'}</span>`:''}
            ${c.progreso?`<span class="ficha-tag warn">${c.progreso} en progreso</span>`:''}
            ${c.pendiente?`<span class="ficha-tag bad">${c.pendiente} pendiente${c.pendiente===1?'':'s'}</span>`:''}
          </div>
        </div>
        <div class="ficha-list-label">Iniciativas</div>
        <div class="ficha-body">
          ${items.map(r=>`
            <div class="ficha-item">
              <span class="ficha-item-nombre">${esc(r.iniciativa)}</span>
              <span class="badge ${r.estatus}">${STATE_LABEL[r.estatus]}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="section-head">
      <div class="eyebrow">Mínimo · 75%</div>
      <h2>Ejecución del plan de integración cultural</h2>
      <p>Resumen ejecutivo del roadmap por gerencia: ${DATA.roadmap.length} iniciativas · ${counts.completado} completadas · ${counts.progreso} en progreso · ${counts.pendiente} pendientes</p>
    </div>
    <div class="avance-box">
      <div class="avance-val">${minimoAvg}%</div>
      <div class="avance-lbl">Avance promedio<br><span>promedio de las ${avanceCount} de ${DATA.roadmap.length} iniciativas que ya tienen % registrado en la columna "Avance" — subirá o bajará a medida que se completen las demás</span></div>
    </div>
    <div class="filters-row">
      <select class="filter-select" id="fEstatus" onchange="setFilterEstatus(this.value)">
        <option value="">Todos los estatus (${DATA.roadmap.length})</option>
        <option value="completado" ${filterEstatus==='completado'?'selected':''}>Completado (${counts.completado})</option>
        <option value="progreso" ${filterEstatus==='progreso'?'selected':''}>En progreso (${counts.progreso})</option>
        <option value="pendiente" ${filterEstatus==='pendiente'?'selected':''}>Pendiente (${counts.pendiente})</option>
      </select>
    </div>
    <div class="roadmap-count">Mostrando ${rows.length} de ${DATA.roadmap.length} iniciativas, en ${order.length} áreas</div>
    <div class="ficha-grid">${fichasHtml}</div>
  `;
}
function setFilterEstatus(v){ filterEstatus = v; renderMain(); }

    <div class="section-head">

    <div class="exec-banner"><span class="ic">✅</span> Ejecutado — ${esc(d.estado)}</div>

/* ================= SUPERIOR: organigramas ================= */
function splitTitular(t){
  const parts = String(t).split(' — ');
  return { cargo: parts[0], persona: parts.slice(1).join(' — ') };
}
function orgMemberHtml(m){
  const {cargo, persona} = splitTitular(m);
  const isVac = /vacante|sin asignar/i.test(persona);
  return `<div class="org-child"><div class="cargo">${esc(cargo)}</div><div class="chain-row ${isVac?'vacante':''}">${esc(persona)}</div></div>`;
}
function orgGrupoHtml(g, idx){
  const {cargo, persona} = splitTitular(g.titular);
  const isVac = /vacante/i.test(persona) || /vacante/i.test(cargo);
  return `
    <div class="orgchart" ${idx>0?'style="margin-top:26px;"':''}>
      <div class="org-box">
        <div class="cargo">${esc(cargo)}</div>
        ${persona ? `<div class="persona ${isVac?'vacante':''}">${esc(persona)}</div>` : ''}
      </div>
      <div class="org-vline"></div>
      <div class="org-hline-wrap"><div class="org-hline"></div></div>
      <div class="org-children">
        ${g.equipo.map(orgMemberHtml).join('')}
      </div>
    </div>
  `;
}
function orgDeptHtml(dept){
  return `
    <div class="org-dept">
      <div class="org-dept-title">${esc(dept.depto)}</div>
      ${dept.grupos.map((g,idx)=>orgGrupoHtml(g,idx)).join('')}
      ${dept.nota ? `<div class="org-note">${esc(dept.nota)}</div>` : ''}
    </div>
  `;
}
function renderSuperior(){
  return `
    <div class="section-head">
      <div class="eyebrow">Superior · 125%</div>
      <h2>Estructura Organizacional FTD Argentina</h2>
      <p>Cómo vamos a operar por área, con roles y responsables bien definidos</p>
    </div>
    <div class="exec-banner"><span class="ic">✅</span> Ejecutado — Estructura deseada levantada y validada por departamento.</div>
    ${DATA.org.map(orgDeptHtml).join('')}
  `;
}

function renderMain(){
  const el = document.getElementById('mainContent');
  if(currentTab==='resumen') el.innerHTML = renderResumen();
  else if(currentTab==='minimo') el.innerHTML = renderMinimo();
  else if(currentTab==='meta') el.innerHTML = renderMeta();
  else if(currentTab==='superior') el.innerHTML = renderSuperior();
}

DATA.roadmap = DATA.roadmap.filter(r=>!isExcludedArea(r.area));
renderTabsBar();
renderMain();
loadRoadmapLive();
</script>
